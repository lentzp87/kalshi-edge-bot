# All knobs in one place. Do not edit while a position is open.

bankroll_usd: 2000

scanner:
  loop_interval_seconds: 30
  max_pages_per_scan: 200    # ~40k markets - covers full Kalshi universe
  price_min: 0.10            # 10¢-90¢ band (Kalshi has many tail markets)
  price_max: 0.90
  max_spread_cents: 25       # Kalshi sports/event markets routinely have 15-25¢ spreads
  min_liquidity_usd: 25      # uses yes_bid_size_fp + yes_ask_size_fp (Kalshi's liquidity_dollars is broken)
  max_minutes_to_expiry: 4320  # 3 days
  min_minutes_to_expiry: 30
  # Optional: if set, skip the broad pagination and only fetch these
  # series directly. Use Kalshi series_ticker prefixes. Empty = scan all.
  # Categorization is now done dynamically via Kalshi's /series catalog
  # (loaded at startup). Leave empty for broad scan — every market gets
  # its real category, and markets without an enabled model are skipped
  # automatically downstream. Only set this if you want to limit which
  # series the bot fetches at the API level (e.g. for very low-latency).
  series_tickers: []

decision:
  min_edge: 0.06             # 6 percentage points minimum
  kelly_fraction: 0.25       # fraction of full Kelly to size by

risk:
  max_position_size_usd: 40
  max_concurrent_positions: 15
  max_open_exposure_pct: 0.40   # 40% of bankroll
  max_daily_loss_usd: 100
  max_consecutive_losses: 3
  cooldown_minutes_after_kill: 60

execution:
  take_profit_pct: 0.20      # exit at +20% on the position
  stop_loss_pct: 0.12        # exit at -12% on the position
  time_exit_minutes: 90      # if neither hit, kill the position after 90 min
  order_type: limit          # never market orders
  scale_in_chunks: 2         # split each entry into 2 child orders

# Per-category enables. Start with weather only.
models:
  weather:
    enabled: true
    horizon_hours: 24
  econ:
    enabled: false
    sources: ["bls", "bea"]
  sports:
    enabled: false           # efficient market — leave off until you have edge
  crypto:
    enabled: false
  politics:
    enabled: false
