# All knobs in one place. Do not edit while a position is open.

bankroll_usd: 2000

scanner:
  loop_interval_seconds: 30
  max_pages_per_scan: 200    # ~40k markets - covers full Kalshi universe
  price_min: 0.10            # 10¢-90¢ band (Kalshi has many tail markets)
  price_max: 0.90
  max_spread_cents: 25       # Kalshi sports/event markets routinely have 15-25¢ spreads
  min_liquidity_usd: 25      # uses yes_bid_size_fp + yes_ask_size_fp (Kalshi's liquidity_dollars is broken)
  # Same-day focus: only markets that resolve within the next 24 hours.
  # Resolution time = `expected_expiration_time` (game time / day-end), NOT
  # `close_time` (when trading stops, which can be weeks later for playoffs).
  # 2026-05-12: widened from 24h → 36h. First Bangladesh-vs-Pakistan
  # cricket trade in bot history hit at Tip=24.0h — right at the prior
  # boundary. Cricket Test matches span 5 days and most of our model
  # MAX windows (tennis 36h, soccer 36h, cricket 36h) are 36h, so this
  # aligns the scanner with the models.
  max_minutes_to_expiry: 2160   # 36 hours
  min_minutes_to_expiry: 5      # skip markets resolving in <5 min (no time to react)
  # Only scan markets in these Kalshi categories; everything else gets dropped
  # at the scanner. Empty list = scan every category.
  allowed_categories:
    - Sports
    - Climate and Weather
  # Optional: if set, skip the broad pagination and only fetch these
  # series directly. Use Kalshi series_ticker prefixes. Empty = scan all.
  # Targeted scan: fetch ONLY these specific Kalshi series instead of
  # walking the full 40k+ market catalog. Each call returns ~10-20 markets
  # so total scan completes in 2-5 seconds.
  # Tickers below were each verified live via the Kalshi API to return
  # active markets (curl /markets?series_ticker=X). Inactive tickers
  # removed; will be re-verified when needed.
  series_tickers:
    # HIGH temperature - verified active
    - KXHIGHTDAL    # Dallas
    - KXHIGHAUS     # Austin
    - KXHIGHTHOU    # Houston
    - KXHIGHTSATX   # San Antonio
    - KXHIGHTNOLA   # New Orleans
    - KXHIGHMIA     # Miami
    - KXHIGHCHI     # Chicago
    - KXHIGHTLV     # Las Vegas
    - KXHIGHUS      # National
    - KXHIGHTPHX    # Phoenix
    - KXHIGHNY      # NYC
    - KXHIGHDEN     # Denver
    # LOW temperature - verified active
    - KXLOWTDAL     # Dallas
    - KXLOWTSATX    # San Antonio
    - KXLOWTMIA     # Miami
    - KXLOWTLV      # Las Vegas
    - KXLOWTDC      # Washington DC
    - KXLOWTPHX     # Phoenix
    - KXLOWTDEN     # Denver
    - KXLOWTAUS     # Austin
    - KXLOWTHOU     # Houston
    - KXLOWTNYC     # NYC

decision:
  # PAPER-MODE TUNING (loosened 2026-05-10 to generate flow — first deploy
  # with all 5 coroutines + new fee gate produced 0 signals over a full
  # scan. Rejection counts came from `decision.skip.*` log lines):
  #   min_edge -0.05         — very loose, fires on any positive gross edge
  #   min_entry_price 0.40   — was 0.50; was rejecting NBA/WNBA coin-flip
  #     games at $0.37-0.49 where the model still has a clear opinion.
  #     Fee math is uglier at $0.40 so the per-market `required_edge` gate
  #     in src/decision.py picks up the slack.
  #   min_p_yes 0.52         — was 0.55, was 0.60. Tennis fills are
  #     often inside the 50-55% band (e.g. Musetti at fill 0.41 won
  #     anyway because the line drifted to 0.50). Want this data.
  # BEFORE LIVE: raise min_edge to >=0.03, restore min_p_yes to 0.60, and
  # tune from CLV / by_confidence calibration data.
  min_edge: -0.05
  kelly_fraction: 0.25
  # Side-specific floors — start uniform at 0.35 today (down from 0.40).
  # Slate analysis 2026-05-13 showed 176 decision.skip.low_price hits at
  # 0.28-0.39 underdog entries; underdogs in the existing data have 54%
  # wr vs 28% for favorites. Letting them through gives flow + tracks a
  # better cohort. Will diverge YES vs NO once dashboard's by_side_x_entry
  # panel shows clear evidence.
  min_entry_price: 0.40         # legacy fallback (unused if both _yes/_no set)
  min_entry_price_yes: 0.35
  min_entry_price_no: 0.35
  # 2026-05-23: upper entry-price caps. by_entry_bucket data + the
  # Kalshi fee curve (peaks at 0.50) show entries above ~60c are a
  # net -$300 fee trap. Cap both sides at 0.60.
  max_entry_price_yes: 0.60
  max_entry_price_no: 0.60
  # 2026-05-23: edges above 15pp are suspect (stale line / mismatch /
  # late news), not opportunity — the 20-25pp edge bucket ran 40% wr,
  # negative P&L. Hard ceiling.
  max_edge: 0.15
  min_p_yes: 0.52
  # 2026-05-19: cap the top end. 80%+ confidence trades over N=36 ran
  # 33% wr / -$285 — model is anti-predictive when most certain.
  # 2026-05-21: tightened 0.78 -> 0.70. With the 80%+ band frozen by
  # the prior cap, the 70-80% bucket became the worst ACTIVE loser:
  # 41 trades, 41% wr, -$154. Set to null to disable; restore upward
  # only if by_confidence calibration improves.
  max_p_yes: 0.70
  # Per-market gate: gross_edge must exceed
  #   entry_fee + exit_fee + half_spread + slippage + safety_pp
  # safety_pp is the cushion above measured costs.
  # 2026-05-12: dropped 0.005 → 0 to gather knife-edge data.
  # 2026-05-13: restored 0 → 0.005. By Edge Bucket panel shows
  # 28 of 29 trades clustered in the 5pp+ bucket but realized
  # -$179.49; the 3-5pp single trade was -$21.83. Edge magnitude
  # alone isn't predicting wins, so the cost-floor cushion is real
  # protection — don't fire on cost-recovery-only trades.
  required_edge_safety_pp: 0.005

risk:
  # Lowered from $40 to $20 per ChatGPT recommendation: validate edge
  # at small size before scaling. Whale-aligned trades still go up to
  # whale_max_position_size_usd (capped at 5x and $200 absolute).
  max_position_size_usd: 20
  max_concurrent_positions: 15
  max_open_exposure_pct: 0.40   # 40% of bankroll
  max_daily_loss_usd: 100
  max_consecutive_losses: 3
  cooldown_minutes_after_kill: 60
  # When a whale-shaped delta (price jump >5c, volume burst >5k contracts,
  # large resting order) aligns with our chosen side, scale up to this
  # cap. Capped at 5x the original Kelly inside execution.py to limit
  # damage if the whale is wrong / spoofed. Set equal to
  # max_position_size_usd to disable the boost.
  # 2026-05-13: was 200, dropped to 100.
  # 2026-05-19: dropped 100 -> 50. That one St. Louis blowout was 35%
  # of our total P&L hit and made the entire aggressive-whale class
  # look bad in retrospect (price_7-10c is actually 80% wr / +$99 over
  # 5 trades; price_10c+ is just one -$100 outlier). Capping single-
  # trade downside at $50 keeps whale boosting alive without letting
  # a single mistake nuke a week.
  whale_max_position_size_usd: 50

execution:
  # 2026-05-11 SL DISABLED. Settlement backtest panel after the v4 DB
  # rotation showed:
  #   "Of 9 stop_loss exits: actual -$115.27, if held to settlement
  #    +$6.72 — stops cost +$121.99"
  # And the A/B Exit Cohorts panel showed all four alternative policies
  # (tp_only_20, sl_only_12, time_only, tp_and_sl_20_12) returned
  # +$67.82 on the same 11-trade window vs actual -$32.50.
  # The model's calls were correct (65-70% confidence bucket would have
  # been 4W-0L on settlement, was 0W-4L on actual). The SL was firing
  # on bid-ask whipsaw at fill (one trade SL'd at hold=0m). Set to 1.0
  # so the (mid - fill) / fill <= -1.0 branch in execution.py can never
  # trigger. Let TP at +50% and time_exit at tipoff handle everything.
  # If we re-introduce SL, do it as a >=10min grace period + use
  # effective_yes_bid (not mid) for the trigger to remove fill-spread.
  take_profit_pct: 0.50
  stop_loss_pct: 1.00
  # Long hold for pregame CLV: line drifts toward truth as tipoff nears.
  time_exit_minutes: 240
  # 2026-05-24: HARD 75-MIN EXIT promoted from backtest to live based on
  # simulator showing +$423 / 63.7% wr over 113 instrumented trades.
  # 2026-05-31: REVERTED after 19 live trades. The live cohort came in
  # at -$204.51 / 21% wr / avg -$10.76 per trade — meaningfully WORSE
  # than the time_exit it replaced (-$8.71 per trade). The simulator
  # overstated the policy: its +$3.16/trade average mostly came from TP
  # winners that closed before 75 min, not from the marginal effect of
  # the cap itself. Setting the cap absurdly high effectively disables
  # the policy while leaving the watcher code path intact and the
  # mid_at_75min instrumentation running — so we can keep collecting
  # data and re-evaluate later with a better simulator that isolates
  # the policy's actual marginal effect (i.e. only the trades that
  # would have held past 75 min, not all 164 instrumented trades).
  hard_exit_minutes: 100000
  order_type: limit
  scale_in_chunks: 2
  # ---- live execution knobs (used only when MODE=live) -------------
  # Entry: poll fills this long, then cancel the unfilled remainder
  # and journal only real fills. Exit: sell limit at best bid,
  # repriced every live_exit_reprice_s up to live_exit_max_reprices;
  # unfilled exits leave the position open and retry after cooldown.
  live_entry_fill_timeout_s: 120
  live_fill_poll_s: 5
  live_exit_reprice_s: 25
  live_exit_max_reprices: 4
  live_exit_retry_cooldown_s: 60

# =====================================================================
# LIVE PROBE CONFIG (2026-06-10) — NOT ACTIVE until you flip MODE=live
# in the Render env. Purpose is MEASUREMENT, not profit: real fills are
# ground truth on TP fillability — the question that decides whether
# the paper P&L is real. Expected result: ~breakeven or small loss.
#
# To go live with the probe, change the values above to:
#
#   risk:
#     max_position_size_usd: 2        # 1-2 contracts per trade
#     max_concurrent_positions: 5
#     max_daily_loss_usd: 10          # hard kill switch
#     whale_max_position_size_usd: 2  # disables whale boost
#
#   scanner:
#     series_tickers: ["KXATPMATCH", "KXWTAMATCH"]   # tennis only
#
# Then set env MODE=live (and KALSHI_ENV=prod) on Render, fund the
# account with $50-100, and push. Run 2 weeks or ~50 trades. Compare
# live fill prices vs the mids that triggered them — that gap is the
# real-world answer the broken TP tracker was supposed to estimate.
# =====================================================================

# Per-category enables.
models:
  sports:
    enabled: true            # late-game sports model — see src/models/sports.py
  econ:
    enabled: false
  crypto:
    enabled: false
  politics:
    enabled: false
