# All knobs in one place. Do not edit while a position is open.

bankroll_usd: 2000

scanner:
  loop_interval_seconds: 30
  max_pages_per_scan: 200    # ~40k markets - covers full Kalshi universe
  price_min: 0.10            # 10¢-90¢ band (Kalshi has many tail markets)
  price_max: 0.90
  max_spread_cents: 25       # Kalshi sports/event markets routinely have 15-25¢ spreads
  min_liquidity_usd: 25      # uses yes_bid_size_fp + yes_ask_size_fp (Kalshi's liquidity_dollars is broken)
  # Same-day focus: only markets that resolve within the next 24 hours.
  # Resolution time = `expected_expiration_time` (game time / day-end), NOT
  # `close_time` (when trading stops, which can be weeks later for playoffs).
  max_minutes_to_expiry: 1440   # 24 hours
  min_minutes_to_expiry: 5      # skip markets resolving in <5 min (no time to react)
  # Only scan markets in these Kalshi categories; everything else gets dropped
  # at the scanner. Empty list = scan every category.
  allowed_categories:
    - Sports
    - Climate and Weather
  # Optional: if set, skip the broad pagination and only fetch these
  # series directly. Use Kalshi series_ticker prefixes. Empty = scan all.
  # Targeted scan: fetch ONLY these specific Kalshi series instead of
  # walking the full 40k+ market catalog. Each call returns ~10-20 markets
  # so total scan completes in 2-5 seconds.
  # Tickers below were each verified live via the Kalshi API to return
  # active markets (curl /markets?series_ticker=X). Inactive tickers
  # removed; will be re-verified when needed.
  series_tickers:
    # HIGH temperature - verified active
    - KXHIGHTDAL    # Dallas
    - KXHIGHAUS     # Austin
    - KXHIGHTHOU    # Houston
    - KXHIGHTSATX   # San Antonio
    - KXHIGHTNOLA   # New Orleans
    - KXHIGHMIA     # Miami
    - KXHIGHCHI     # Chicago
    - KXHIGHTLV     # Las Vegas
    - KXHIGHUS      # National
    - KXHIGHTPHX    # Phoenix
    - KXHIGHNY      # NYC
    - KXHIGHDEN     # Denver
    # LOW temperature - verified active
    - KXLOWTDAL     # Dallas
    - KXLOWTSATX    # San Antonio
    - KXLOWTMIA     # Miami
    - KXLOWTLV      # Las Vegas
    - KXLOWTDC      # Washington DC
    - KXLOWTPHX     # Phoenix
    - KXLOWTDEN     # Denver
    - KXLOWTAUS     # Austin
    - KXLOWTHOU     # Houston
    - KXLOWTNYC     # NYC

decision:
  # PAPER-MODE TUNING (loosened 2026-05-10 to generate flow — first deploy
  # with all 5 coroutines + new fee gate produced 0 signals over a full
  # scan. Rejection counts came from `decision.skip.*` log lines):
  #   min_edge -0.05         — very loose, fires on any positive gross edge
  #   min_entry_price 0.40   — was 0.50; was rejecting NBA/WNBA coin-flip
  #     games at $0.37-0.49 where the model still has a clear opinion.
  #     Fee math is uglier at $0.40 so the per-market `required_edge` gate
  #     in src/decision.py picks up the slack.
  #   min_p_yes 0.55         — was 0.60; was rejecting MLB favorites the
  #     model put at 52-55%. We're paper-trading: cast a wider net, then
  #     read the by_confidence dashboard panel to see what win rate we
  #     actually realize per bucket.
  # BEFORE LIVE: raise min_edge to >=0.03, restore min_p_yes to 0.60, and
  # tune from CLV / by_confidence calibration data.
  min_edge: -0.05
  kelly_fraction: 0.25
  min_entry_price: 0.40
  min_p_yes: 0.55
  # Per-market gate: gross_edge must exceed
  #   entry_fee + exit_fee + half_spread + slippage + safety_pp
  # safety_pp is the cushion above measured costs. 0.005 = 0.5pp.
  required_edge_safety_pp: 0.005

risk:
  # Lowered from $40 to $20 per ChatGPT recommendation: validate edge
  # at small size before scaling. Whale-aligned trades still go up to
  # whale_max_position_size_usd (capped at 5x and $200 absolute).
  max_position_size_usd: 20
  max_concurrent_positions: 15
  max_open_exposure_pct: 0.40   # 40% of bankroll
  max_daily_loss_usd: 100
  max_consecutive_losses: 3
  cooldown_minutes_after_kill: 60
  # When a whale-shaped delta (price jump >5c, volume burst >5k contracts,
  # large resting order) aligns with our chosen side, scale up to this
  # cap. Capped at 5x the original Kelly inside execution.py to limit
  # damage if the whale is wrong / spoofed. Set equal to
  # max_position_size_usd to disable the boost.
  whale_max_position_size_usd: 200

execution:
  # 2026-05-11 SL DISABLED. Settlement backtest panel after the v4 DB
  # rotation showed:
  #   "Of 9 stop_loss exits: actual -$115.27, if held to settlement
  #    +$6.72 — stops cost +$121.99"
  # And the A/B Exit Cohorts panel showed all four alternative policies
  # (tp_only_20, sl_only_12, time_only, tp_and_sl_20_12) returned
  # +$67.82 on the same 11-trade window vs actual -$32.50.
  # The model's calls were correct (65-70% confidence bucket would have
  # been 4W-0L on settlement, was 0W-4L on actual). The SL was firing
  # on bid-ask whipsaw at fill (one trade SL'd at hold=0m). Set to 1.0
  # so the (mid - fill) / fill <= -1.0 branch in execution.py can never
  # trigger. Let TP at +50% and time_exit at tipoff handle everything.
  # If we re-introduce SL, do it as a >=10min grace period + use
  # effective_yes_bid (not mid) for the trigger to remove fill-spread.
  take_profit_pct: 0.50
  stop_loss_pct: 1.00
  # Long hold for pregame CLV: line drifts toward truth as tipoff nears.
  time_exit_minutes: 240
  order_type: limit
  scale_in_chunks: 2

# Per-category enables.
models:
  sports:
    enabled: true            # late-game sports model — see src/models/sports.py
  econ:
    enabled: false
  crypto:
    enabled: false
  politics:
    enabled: false
